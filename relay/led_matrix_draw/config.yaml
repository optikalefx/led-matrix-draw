name: LED Matrix Draw
version: "0.6.0"
slug: led_matrix_draw
description: Relay for the ESP32 LED matrix - speech to text, then Claude draws 16x16 pixel art or writes Lua animations
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: HTTP API used by the ESP32
options:
  openai_api_key: ""
  anthropic_api_key: ""
  stt_model: gpt-4o-mini-transcribe
  claude_model: claude-sonnet-5
schema:
  openai_api_key: password
  anthropic_api_key: password
  stt_model: str
  claude_model: str
